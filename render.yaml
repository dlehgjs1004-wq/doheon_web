databases:
  - name: ollama-hub-db
    plan: free

services:
  - type: web
    name: ollama-hub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ollama-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OLLAMA_BASE_URL
        sync: false
      - key: STORAGE_ROOT
        value: /var/data/uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
    disk:
      name: ollama-hub-data
      mountPath: /var/data
      sizeGB: 1
